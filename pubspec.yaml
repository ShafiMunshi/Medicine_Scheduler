name: medicine_app
description: "A medicine reminder and scheduler app built with Flutter, Riverpod, Drift, and Flutter Local Notifications."

publish_to: "none"

version: 1.0.0+2

environment:
  sdk: ^3.6.1

dependencies:
  cached_network_image: ^3.4.1
  calendar_date_picker2: ^2.0.0
  cloud_firestore: ^5.6.6
  cupertino_icons: ^1.0.8
  drift: ^2.24.0
  drift_flutter: ^0.2.2
  dropdown_button2: ^2.3.9
  easy_date_timeline: ^2.0.9
  firebase_auth: ^5.5.2
  firebase_core: ^3.13.0
  firebase_storage: ^12.4.5
  fl_chart: ^0.70.2
  flutter:
    sdk: flutter
  flutter_bounceable: ^1.2.0
  flutter_dotenv: ^5.2.1
  flutter_local_notifications: ^18.0.1
  flutter_riverpod: ^2.6.1
  flutter_scalable_ocr: ^2.2.1
  flutter_screenutil: ^5.9.3
  flutter_slidable: ^4.0.0
  flutter_svg: ^2.0.10+1
  flutter_timezone: ^3.0.1
  fluttertoast: ^8.2.12
  google_fonts: ^6.3.3
  google_sign_in: ^6.3.0
  http: ^1.3.0
  iconsax: ^0.0.8
  image_picker: ^1.1.2
  in_app_review: ^2.0.10
  intl: ^0.20.2
  logger: ^2.4.0
  nb_utils: ^7.1.3
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.5
  sign_in_with_apple: ^6.1.4
  timezone: ^0.9.4

dev_dependencies:
  build_runner: ^2.4.13
  drift_dev: ^2.24.0
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true
  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/icons/
